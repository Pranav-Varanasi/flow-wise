name: Build and Deploy

on:
  push:
    branches:
      - Agent-working-Pranav
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      owner_lc: ${{ steps.owner.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize repository owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/flow-wise-backend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/flow-wise-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/flow-wise-frontend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/flow-wise-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/Agent-working-Pranav'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/flow-wise
            export GHCR_OWNER=${{ needs.build-and-push.outputs.owner_lc }}
            export IMAGE_TAG=${{ github.sha }}
            cat > .env <<'EOF'
            CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}
            CLAUDE_MODEL=${{ secrets.CLAUDE_MODEL }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}
            GHCR_OWNER=${{ needs.build-and-push.outputs.owner_lc }}
            EOF
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
